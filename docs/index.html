go zamiast pracy z bioder."]}},X0={lateral:{setup:["Stań prosto, hantle po bokach, lekko ugięte łokcie."],steps:["Unieś hantle bokiem do wysokości barków, prowadząc łokciem.","Zatrzymaj na chwilę na szczycie.","Opuść hantle kontrolowanie, bez bujania ciałem."],mistakes:["Zarzucanie ciężaru pędem tułowia.","Unoszenie zbyt wysoko kosztem barku."]},ohp:{setup:["Sztanga na wysokości obojczyków, chwyt nieco szerszy niż barki, pośladki i brzuch spięte."],steps:["Wypchnij sztangę pionowo w górę, przesuwając głowę lekko do tyłu w połowie ruchu.","Zablokuj ręce na górze, sztanga nad środkiem stopy.","Opuść sztangę kontrolowanie do wysokości obojczyków."],mistakes:["Nadmierne odchylanie się do tyłu.","Wypychanie samymi barkami bez stabilizacji tułowia."],safety:"Trzymaj spięty brzuch i pośladki przez cały ruch — to chroni odcinek lędźwiowy przy wypychaniu nad głowę."},face_pull:{setup:["Wyciąg na wysokości twarzy, chwyt liny, lekki odkrok do tyłu."],steps:["Ciągnij linę do twarzy, rozciągając ją na końcu ruchu.","Łokcie prowadź wysoko, na wysokości barków.","Wróć kontrolowanie do pełnego wyprostu ramion."],mistakes:["Ciągnięcie nisko, do klatki zamiast do twarzy.","Zbyt duży ciężar kosztem zakresu ruchu."]},ohp_db:{setup:["Usiądź lub stań, hantle na wysokości barków, dłonie zwrócone do przodu."],steps:["Wypchnij hantle pionowo w górę, aż ramiona się wyprostują nad głową.","Zbliż hantle nad głową, nie stukając nimi o siebie.","Opuść hantle kontrolowanie do wysokości barków."],mistakes:["Nadmierne odchylanie tułowia do tyłu.","Wypychanie hantli zbyt daleko przed siebie zamiast pionowo."]},arnold_press:{setup:["Usiądź, hantle przed barkami, dłonie zwrócone do siebie (chwyt jak w podchwycie do klatki)."],steps:["Wypychaj hantle w górę, jednocześnie rotując nadgarstki na zewnątrz.","Na górze ramiona wyprostowane, dłonie zwrócone do przodu.","Wróć tym samym torem z rotacją, kontrolowanie, do pozycji startowej."],mistakes:["Zbyt szybka rotacja bez kontroli ciężaru.","Nadmierne odchylanie się do tyłu przy wypychaniu."]},lateral_cable:{setup:["Stań bokiem do wyciągu dolnego, uchwyt w dalszej od wyciągu ręce, ręka przy boku."],steps:["Unieś ramię bokiem do wysokości barku, prowadząc łokciem.","Zatrzymaj na chwilę na szczycie.","Opuść kontrolowanie, czując stały opór przez cały zakres."],mistakes:["Zarzucanie ciężaru pędem tułowia.","Odwracanie się tułowiem zamiast izolacji barku."]},rear_delt_db:{setup:["Opad tułowia w biodrach ok. 90°, hantle zwisają pod klatką, łokcie lekko ugięte."],steps:["Unieś hantle w bok i lekko w tył, prowadząc łokciami, nie dłońmi.","Zatrzymaj na wysokości barków, ściągając łopatki.","Opuść hantle kontrolowanie do pozycji startowej."],mistakes:["Prostowanie tułowia, żeby pomóc sobie pędem.","Unoszenie ramion w górę zamiast w tył."]},rear_delt_machine:{setup:["Usiądź przodem do maszyny, klatka oparta o poduszkę, chwyć uchwyty przed sobą."],steps:["Prowadź ramiona w tył i na boki, na wysokości barków.","Ściągnij łopatki na końcu ruchu.","Wróć kontrolowanie do pozycji startowej."],mistakes:["Odrywanie klatki od poduszki.","Zbyt duży ciężar skracający zakres ruchu."]},upright_row:{setup:["Stań prosto, sztanga chwytem na szerokość barków, ręce przed udami."],steps:["Unieś sztangę wzdłuż tułowia, prowadząc łokciami wyżej niż nadgarstki.","Zatrzymaj na wysokości klatki piersiowej.","Opuść sztangę kontrolowanie do pełnego wyprostu ramion."],mistakes:["Unoszenie sztangi zbyt wysoko (obciąża barki).","Szarpanie ciężaru pędem tułowia."],safety:"Przy dyskomforcie w barku podczas ruchu w górę skróć zakres albo zamień na wznosy bokiem."},front_raise_db:{setup:["Stań prosto, hantle przed udami, chwyt neutralny lub pronowany."],steps:["Unieś jeden lub oba hantle przodem do wysokości oczu.","Zatrzymaj na chwilę na szczycie.","Opuść hantle kontrolowanie, bez bujania tułowiem."],mistakes:["Bujanie tułowiem, żeby wyrzucić ciężar.","Unoszenie powyżej wysokości oczu kosztem barku."]},shrug_bb:{setup:["Stań prosto, sztanga trzymana przed udam najniżej, rozciągając łydki.","Wypchnij się na palce w pełnym zakresie.","Zatrzymaj na chwilę na górze, wróć kontrolowanie."],mistakes:["Zginanie kolan, żeby oszukać zakres ruchu.","Odbijanie się od dolnej pozycji."]},front_squat:{setup:["Sztanga oparta na przednich barkach, łokcie wysoko, chwyt na szerokość barków lub skrzyżowany."],steps:["Nabierz powietrza, spnij brzuch, utrzymuj tors możliwie pionowo.","Zejdź w dół, prowadząc kolanami zgodnie z kierunkiem stóp, łokcie cały czas wysoko.","Zejdź do pełnej głębokości bez opadania tułowia do przodu.","Wstań, wypychając podłogę stopami."],mistakes:["Opadające łokcie (sztanga zsuwa się z barków).","Pochylanie tułowia do przodu przy wstawaniu."],safety:"Jeśli łokcie nie utrzymują pozycji, zmniejsz ciężar — to pierwszy sygnał utraty kontroli nad sztangą."},goblet_squat:{setup:["Trzymaj hantel oburącz przy klatce, stopy na szerokość barków."],steps:["Zejdź w głęboki przysiad, prowadząc kolanami na zewnątrz, łokcie mijają kolana od wewnątrz.","Zejdź tak nisko, jak pozwala ruchomość, zachowując proste plecy.","Wstań, wypychając podłogę stopami."],mistakes:["Opadanie hantla do przodu (garbi plecy).","Unoszenie pięt zamiast pełnego kontaktu stopy z podłogą."]},leg_press:{setup:["Stopy na szerokość barków na platformie, plecy oparte o siedzisko."],steps:["Odblokuj zabezpieczenia, opuszczaj platformę, prowadząc kolanami zgodnie z kierunkiem stóp.","Zejdź do momentu, aż dolny odcinek pleców zaczyna odrywać się od siedziska — nie dalej.","Wypchnij platformę z powrotem, nie blokując kolan na sztywno na górze."],mistakes:["Blokowanie kolan na górze ruchu.","Zbyt głębokie schodzenie kosztem odrywania bioder od siedziska."]},hack_squat:{setup:["Plecy i barki przyklejone do oparcia, stopy na platformie na szerokość barków."],steps:["Odblokuj zabezpieczenia, zejdź w dół, prowadząc kolanami zgodnie z kierunkiem stóp.","Zejdź do pełnego, kontrolowanego zakresu.","Wstań, wypychając platformę stopami, bez blokowania kolan na sztywno."],mistakes:["Odrywanie pleców od oparcia.","Zbyt szybkie, niekontrolowane opuszczanie."]},leg_ext:{setup:["Usiądź, wałek oparty o podudzia tuż nad kostkami, plecy oparte o siedzisko."],steps:["Prostuj nogi, unosząc wałek aż do pełnego wyprostu kolan.","Zatrzymaj na chwilę na górze.","Opuść kontrolowanie, bez odbicia na dole."],mistakes:["Odbijanie ciężaru na dole zamiast kontroli.","Odrywanie pleców od siedziska przy pchaniu."]},bulgarian_split:{setup:["Tylna stopa oparta na podwyższeniu za tobą, przednia noga w wykroku, hantle po bokach."],steps:["Opuszczaj biodra pionowo w dół, zginając przednie kolano.","Zejdź, aż tylne kolano zbliży się do podłogi.","Wypchnij się z powrotem, pracując głównie przednią nogą."],mistakes:["Zbyt duży ciężar całego ciała na tylnej stopie zamiast przedniej nodze.","Chwiejny balans przez zbyt wąskie ustawienie stóp."]},step_up:{setup:["Stań przed skrzynią/stopniem na wysokości ok. kolana, hantle po bokach."],steps:["Postaw całą stopę na skrzyni, przenieś na nią cały ciężar ciała.","Wypchnij się w górę jedną nogą, bez odbijania się drugą od podłogi.","Zejdź kontrolowanie tą samą nogą do pozycji startowej."],mistakes:["Odbijanie się tylną nogą (odciąża pracującą nogę).","Za wysoki stopień kosztem techniki."]},leg_curl_lying:{setup:["Połóż się przodem, wałek oparty o łydki tuż nad piętami, biodra przyklejone do ławki."],steps:["Zginaj kolana, prowadząc pięty w stronę pośladków.","Zatrzymaj na chwilę w pozycji maksymalnego zgięcia.","Wróć kontrolowanie do pełnego wyprostu nóg, bez odbicia."],mistakes:["Unoszenie bioder z ławki przy ciągnięciu.","Odbijanie ciężaru zamiast kontrolowanego powrotu."]},leg_curl_seated:{setup:["Usiądź, wałek oparty o łydki tuż nad piętami, uda przypięte pasem."],steps:["Zginaj kolana, prowadząc wałek w stronę siedziska.","Zatrzymaj na chwilę w dolnej pozycji zgięcia.","Wróć kontrolowanie do pełnego wyprostu nóg."],mistakes:["Odrywanie ud od siedziska.","Zbyt szybki, niekontrolowany powrót."]},nordic_curl:{setup:["Klęknij, kostki zablokowane (partner lub sprzęt), tułów prosty od kolan w górę."],steps:["Opadaj powoli do przodu, hamując ruch tylną częścią uda tak długo, jak się da.","W momencie utraty kontroli złap się rękami o podłogę, amortyzując upadek.","Wróć do pozycji startowej pomagając sobie rękami — to jedno z najtrudniejszych ćwiczeń, nie wstydź się dopomagać."],mistakes:["Zginanie w biodrach zamiast utrzymania linii prostej tułowia i ud.","Zbyt szybkie opadanie bez kontroli."],safety:"Bardzo wymagające dla tylnej części uda — zacznij od małego zakresu i pomocy rąk, buduj siłę stopniowo."},good_morning:{setup:["Sztanga na górnej części pleców (jak w przysiadzie), stopy na szerokość barków, lekkie zgięcie kolan."],steps:["Zawiasuj w biodrach, odsuwając je do tyłu, z prostym kręgosłupem.","Schodź, aż poczujesz mocne rozciągnięcie tylnej części uda.","Wróć, wypychając biodra do przodu i prostując tułów."],mistakes:["Zaokrąglanie pleców w trakcie schylania.","Zginanie kolan zamiast pracy w biodrach."],safety:"Zacznij od małego ciężaru — to ćwiczenie mocno obciąża dolny odcinek pleców przy błędnej technice."},rdl_bb:{setup:["Sztanga przy udach, chwyt na szerokość barków, lekko ugięte kolana, plecy proste."],steps:["Zawiasuj w biodrach, odsuwając je do tyłu, prowadząc sztangę blisko nóg.","Schodź, aż poczujesz rozciągnięcie tylnej części uda, kolana prawie proste.","Wróć, wypychając biodra do przodu."],mistakes:["Zaokrąglanie pleców na dole.","Sztanga oddalająca się od nóg (dodatkowe obciążenie na plecy)."],safety:"Schodź tylko do granicy, w której plecy zostają proste — dalej to już zaokrąglenie, nie zakres ruchu."},deadlift_sumo:{setup:["Szeroki rozstaw stóp, palce lekko na zewnątrz, chwyt sztangi między kolanami, plecy proste."],steps:["Nabierz powietrza, spnij tułów, kolana w linii palców stóp.","Wypchnij podłogę stopami, prowadząc sztangę blisko nóg.","Wyprostuj biodra na górze, bez przeprostu w plecach.","Opuszczaj sztangę tym samym torem, zawiasując w biodrach i kolanac
