miana w trakcie serii to najczęstsza droga do bólu pleców."},deadlift:{setup:["Sztanga nad środkiem stóp, chwyt tuż za kolanami, plecy proste, biodra wyżej niż w przysiadzie."],steps:["Nabierz powietrza, spnij cały tułów.","Wypchnij podłogę stopami, prowadząc sztangę blisko goleni.","Wyprostuj biodra na górze, bez przeprostu w plecach.","Opuszczaj sztangę tym samym torem, zawiasując w biodrach."],mistakes:["Zaokrąglanie pleców przy podłodze.","Szarpanie sztangi zamiast płynnego wypchnięcia.","Sztanga oddalająca się od nóg."],safety:"UWAGA NA PLECY — przy pierwszym sygnale zaokrąglenia przerwij serię, to nie jest powtórzenie warte ryzyka."},pulldown:{setup:["Usiądź, uda zablokowane pod wałkiem, chwyt szerszy niż barki."],steps:["Ściągnij drążek do górnej części klatki, prowadząc łokciami w dół.","Spnij plecy na dole ruchu.","Wypuść drążek kontrolowanie do pełnego wyprostu ramion."],mistakes:["Odchylanie się mocno do tyłu i ciągnięcie masą ciała.","Ciągnięcie za głowę zamiast przed nią."]},row_db:{setup:["Oprzyj kolano i dłoń o ławkę, plecy równolegle do podłogi, hantel w drugiej ręce."],steps:["Ciągnij hantel do biodra, prowadząc łokieć blisko tułowia.","Ściągnij łopatkę na szczycie.","Opuść hantel kontrolowanie do pełnego wyprostu."],mistakes:["Skręcanie tułowia zamiast pracy ramienia.","Zbyt szybkie opuszczanie ciężaru."]},pullup:{setup:["Chwyć drążek nachwytem, szerzej niż barki, zwis na wyprostowanych ramionach."],steps:["Zainicjuj ruch ściągnięciem łopatek w dół.","Podciągnij się, aż broda znajdzie się nad drążkiem.","Opuść się kontrolowanie do pełnego wyprostu ramion."],mistakes:["Huśtanie się i pomaganie sobie nogami (kipping).","Zatrzymywanie się w połowie zakresu."]},chinup:{setup:["Chwyć drążek podchwytem, dłonie blisko siebie, zwis na wyprostowanych ramionach."],steps:["Zainicjuj ruch ściągnięciem łopatek.","Podciągnij się, prowadząc łokcie blisko tułowia, aż broda minie drążek.","Opuść się kontrolowanie do pełnego wyprostu."],mistakes:["Huśtanie ciałem zamiast pracy pleców i bicepsa.","Skracanie zakresu ruchu na górze lub dole."]},pulldown_neutral:{setup:["Usiądź, uda zablokowane pod wałkiem, chwyt za uchwyty równoległe (dłonie zwrócone do siebie)."],steps:["Ściągnij uchwyty do górnej części klatki, łokcie blisko tułowia.","Spnij plecy na dole ruchu.","Wypuść uchwyty kontrolowanie do pełnego wyprostu ramion."],mistakes:["Odchylanie tułowia zbyt mocno do tyłu.","Ciągnięcie samymi ramionami bez pracy łopatek."]},row_cable:{setup:["Usiądź, stopy oparte o platformę, chwyć uchwyt przy lekko ugiętych kolanach, plecy proste."],steps:["Ciągnij uchwyt do brzucha, prowadząc łokcie blisko tułowia.","Ściągnij łopatki na końcu ruchu.","Wróć kontrolowanie do pełnego wyprostu ramion, bez zaokrąglania pleców."],mistakes:["Bujanie tułowiem do przodu i do tyłu zamiast pracy ramion.","Garbienie się przy powrocie."]},row_tbar:{setup:["Stań okrakiem nad sztangą (lub w uchwycie T-bar), tułów pod kątem ok. 45°, plecy proste."],steps:["Ciągnij ciężar do mostka/dolnej klatki, łokcie blisko tułowia.","Ściągnij łopatki na szczycie ruchu.","Opuść kontrolowanie do pełnego wyprostu ramion."],mistakes:["Prostowanie tułowia przy każdym powtórzeniu.","Zaokrąglanie pleców pod obciążeniem."],safety:"Stały kąt tułowia przez całą serię — nie prostuj się, żeby „pomóc” sobie przy cięższych powtórzeniach."},row_machine:{setup:["Klatka oparta o poduszkę, chwyć uchwyty na wysokości klatki."],steps:["Ciągnij uchwyty łokciami do tyłu, ściągając łopatki.","Zatrzymaj na chwilę w pozycji ściągnięcia.","Wróć kontrolowanie do pełnego wyprostu ramion."],mistakes:["Odrywanie klatki od poduszki.","Ciągnięcie samymi dłońmi bez pracy łopatek."]},row_db_bent:{setup:["Plecy proste, opad w biodrach ok. 45°, hantle zwisają przy prostych ramionach."],steps:["Ciągnij oba hantle jednocześnie do bioder, łokcie blisko tułowia.","Ściągnij łopatki na szczycie.","Opuść hantle kontrolowanie do pełnego wyprostu."],mistakes:["Prostowanie tułowia w trakcie serii.","Szarpanie ciężaru zamiast płynnego ciągnięcia."],safety:"Utrzymuj stały kąt opadu — zmiana kąta pod obciążeniem to najczęstsza droga do bólu pleców."},rack_pull:{setup:["Sztanga oparta na podstawkach na wysokości kolan, chwyt tuż za kolanami, plecy proste."],steps:["Nabierz powietrza, spnij cały tułów.","Wyprostuj biodra i kolana jednocześnie, prowadząc sztangę blisko nóg.","Wyprostuj się w pełni na górze, bez przeprostu w plecach.","Opuść sztangę kontrolowanie z powrotem na podstawki."],mistakes:["Zaokrąglanie pleców przy starcie.","Zbyt duży ciężar kosztem pełnego wyprostu bioder na górze."],safety:"Mniejszy zakres niż martwy ciąg klasyczny kusi do przeładowania sztangi — dobieraj ciężar pod technikę, nie na odwrót."},pulldown_straight:{setup:["Stań lub usiądź przodem do wyciągu górnego, chwyć drążek prostymi ramionami nad głową."],steps:["Prowadź ramiona w dół i lekko do tyłu, ruch tylko w barkach (łokcie prawie proste).","Zatrzymaj drążek przy udach.","Wróć kontrolowanie do pozycji nad głową."],mistakes:["Zginanie łokci — zamienia izolację w wiosłowanie.","Pomaganie sobie tułowiem."]},shrug_db:{setup:["Stań prosto, hantle po bokach, ramiona swobodnie opuszczone."],steps:["Unieś barki prosto w górę, jak najbliżej uszu.","Zatrzymaj na chwilę w najwyższym punkcie.","Opuść barki kontrolowanie do pozycji startowej."],mistakes:["Kręcenie barkami w kółko zamiast ruchu w linii prostej.","Pomaganie sobie uginaniem łokci."]},back_ext:{setup:["Ułóż się biodrami na ławce do hiperekstensji, kostki zablokowane, tułów swobodnie opuszczony."],steps:["Opuszczaj tułów w dół z prostym kręgosłupem, aż poczujesz rozciągnięcie tylnej części uda.","Unieś tułów, prowadząc ruch z bioder, do linii prostej z nogami.","Nie przeprostowuj kręgosłupa na górze ruchu."],mistakes:["Przeprost pleców na szczycie (wyginanie do tyłu).","Zginanie odcinka lędźwiowego zamiast pracy z bioder."]}},s0={lateral:{setup:["Stań prosto, hantle po bokach, lekko ugięte łokcie."],steps:["Unieś hantle bokiem do wysokości barków, prowadząc łokciem.","Zatrzymaj na chwilę na szczycie.","Opuść hantle kontrolowanie, bez bujania ciałem."],mistakes:["Zarzucanie ciężaru pędem tułowia.","Unoszenie zbyt wysoko kosztem barku."]},ohp:{setup:["Sztanga na wysokości obojczyków, chwyt nieco szerszy niż barki, pośladki i brzuch spięte."],steps:["Wypchnij sztangę pionowo w górę, przesuwając głowę lekko do tyłu w połowie ruchu.","Zablokuj ręce na górze, sztanga nad środkiem stopy.","Opuść sztangę kontrolowanie do wysokości obojczyków."],mistakes:["Nadmierne odchylanie się do tyłu.","Wypychanie samymi barkami bez stabilizacji tułowia."],safety:"Trzymaj spięty brzuch i pośladki przez cały ruch — to chroni odcinek lędźwiowy przy wypychaniu nad głowę."},face_pull:{setup:["Wyciąg na wysokości twarzy, chwyt liny, lekki odkrok do tyłu."],steps:["Ciągnij linę do twarzy, rozciągając ją na końcu ruchu.","Łokcie prowadź wysoko, na wysokości barków.","Wróć kontrolowanie do pełnego wyprostu ramion."],mistakes:["Ciągnięcie nisko, do klatki zamiast do twarzy.","Zbyt duży ciężar kosztem zakresu ruchu."]},ohp_db:{setup:["Usiądź lub stań, hantle na wysokości barków, dłonie zwrócone do przodu."],steps:["Wypchnij hantle pionowo w górę, aż ramiona się wyprostują nad głową.","Zbliż hantle nad głową, nie stukając nimi o siebie.","Opuść hantle kontrolowanie do wysokości barków."],mistakes:["Nadmierne odchylanie tułowia do tyłu.","Wypychanie hantli zbyt daleko przed siebie zamiast pionowo."]},arnold_press:{setup:["Usiądź, hantle przed barkami, dłonie zwrócone do siebie (chwyt jak w podchwycie do klatki)."],steps:["Wypychaj hantle w górę, jednocześnie rotując nadgarstki na zewnątrz.","Na górze ramiona wyprostowane, dłonie zwrócone do przodu.","Wróć tym samym torem z rotacją, kontrolowanie, do pozycji startowej."],mistakes:["Zbyt szybka rotacja bez kontroli ciężaru.","Nadmierne odchylanie się do tyłu przy wypychaniu."]},lateral_cable:{setup:["Stań bokiem do wyciągu dolnego, uchwyt w dalszej od wyciągu ręce, ręka przy boku."],steps:["Unieś ramię bokiem do wysokości barku, prowadząc łokciem.","Zatrzymaj na chwilę na szczycie.","Opuść kontrolowanie, czując stały opór przez cały zakres."],mistakes:["Zarzucanie ciężaru pędem tułowia.","Odwracanie się tułowiem zamiast izolacji barku."]},rear_delt_db:{setup:["Opad tułowia w biodrach ok. 90°, hantle zwisają pod klatką, łokcie lekko ugięte."],steps:["Unieś hantle w bok i lekko w tył, prowadząc łokciami, nie dłońmi.","Zatrzymaj na wysokości barków, ściągając łopatki.","Opuść hantle kontrolowanie do pozycji startowej."],mistakes:["Prostowanie tułowia, żeby pomóc sobie pędem.","Unoszenie ramion w górę zamiast w tył."]},rear_delt_machine:{setup:["Usiądź przodem do maszyny, klatka oparta o poduszkę, chwyć uchwyty przed sobą."],steps:["Prowadź ramiona w tył i na boki, na wysokości barków.","Ściągnij łopatki na końcu ruchu.","Wróć kontrolowanie do pozycji startowej."],mistakes:["Odrywanie klatki od poduszki.","Zbyt duży ciężar skracający zakres ruchu."]},upright_row:{setup:["Stań prosto, sztanga chwytem na szerokość barków, ręce przed udami."],steps:["Unieś sztangę wzdłuż tułowia, prowadząc łokciami wyżej niż nadgarstki.","Zatrzymaj na wysokości klatki piersiowej.","Opuść sztangę kontrolowanie do pełnego wyprostu ramion."],mistakes:["Unoszenie sztangi zbyt wysoko (obciąża barki).","Szarpanie ciężaru pędem tułowia."],safety:"Przy dyskomforcie w barku podczas ruchu w górę skróć zakres albo zamień na wznosy bokiem."},front_raise_db:{setup:["Stań prosto, hantle przed udami, chwyt neutralny lub pronowany."],steps:["Unieś jeden lub oba hantle przodem do wysokości oczu.","Zatrzymaj na chwilę na szczycie.","Opuść hantle kontrolowanie, bez bujania tułowiem."],mistakes:["Bujanie tułowiem, żeby wyrzucić ciężar.","Unoszenie powyżej wysokości oczu kosztem barku."]},shrug_bb:{setup:["Stań prosto, sztanga trzymana przed udami, chwyt na szerokość barków."],steps:["Unieś barki prosto w górę, jak najbliżej uszu.","Zatrzymaj na chwilę w najwyższym punkcie.","Opuść barki kontrolowanie oszukać zakres ruchu.","Odbijanie się od dolnej pozycji."]},front_squat:{setup:["Sztanga oparta na przednich barkach, łokcie wysoko, chwyt na szerokość barków lub skrzyżowany."],steps:["Nabierz powietrza, spnij brzuch, utrzymuj tors możliwie pionowo.","Zejdź w dół, prowadząc kolanami zgodnie z kierunkiem stóp, łokcie cały czas wysoko.","Zejdź do pełnej głębokości bez opadania tułowia do przodu.","Wstań, wypychając podłogę stopami."],mistakes:["Opadające łokcie (sztanga zsuwa się z barków).","Pochylanie tułowia do przodu przy wstawaniu."],safety:"Jeśli łokcie nie utrzymują pozycji, zmniejsz ciężar — to pierwszy sygnał utraty kontroli nad sztangą."},goblet_squat:{setup:["Trzymaj hantel oburącz przy klatce, stopy na szerokość barków."],steps:["Zejdź w głęboki przysiad, prowadząc kolanami na zewnątrz, łokcie mijają kolana od wewnątrz.","Zejdź tak nisko, jak pozwala ruchomość, zachowując proste plecy.","Wstań, wypychając podłogę stopami."],mistakes:["Opadanie hantla do przodu (garbi plecy).","Unoszenie pięt zamiast pełnego kontaktu stopy z podłogą."]},leg_press:{setup:["Stopy na szerokość barków na platformie, plecy oparte o siedzisko."],steps:["Odblokuj zabezpieczenia, opuszczaj platformę, prowadząc kolanami zgodnie z kierunkiem stóp.","Zejdź do momentu, aż dolny odcinek pleców zaczyna odrywać się od siedziska — nie dalej.","Wypchnij platformę z powrotem, nie blokując kolan na sztywno na górze."],mistakes:["Blokowanie kolan na górze ruchu.","Zbyt głębokie schodzenie kosztem odrywania bioder od siedziska."]},hack_squat:{setup:["Plecy i barki przyklejone do oparcia, stopy na platformie na szerokość barków."],steps:["Odblokuj zabezpieczenia, zejdź w dół, prowadząc kolanami zgodnie z kierunkiem stóp.","Zejdź do pełnego, kontrolowanego zakresu.","Wstań, wypychając platformę stopami, bez blokowania kolan na sztywno."],mistakes:["Odrywanie pleców od oparcia.","Zbyt szybkie, niekontrolowane opuszczanie."]},leg_ext:{setup:["Usiądź, wałek oparty o podudzia tuż nad kostkami, plecy
