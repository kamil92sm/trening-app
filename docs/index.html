akes:["Nadmierne odchylanie się do tyłu.","Wypychanie samymi barkami bez stabilizacji tułowia."],safety:"Trzymaj spięty brzuch i pośladki przez cały ruch — to chroni odcinek lędźwiowy przy wypychaniu nad głowę."},face_pull:{setup:["Wyciąg na wysokości twarzy, chwyt liny, lekki odkrok do tyłu."],steps:["Ciągnij linę do twarzy, rozciągając ją na końcu ruchu.","Łokcie prowadź wysoko, na wysokości barków.","Wróć kontrolowanie do pełnego wyprostu ramion."],mistakes:["Ciągnięcie nisko, do klatki zamiast do twarzy.","Zbyt duży ciężar kosztem zakresu ruchu."]},ohp_db:{setup:["Usiądź lub stań, hantle na wysokości barków, dłonie zwrócone do przodu."],steps:["Wypchnij hantle pionowo w górę, aż ramiona się wyprostują nad głową.","Zbliż hantle nad głową, nie stukając nimi o siebie.","Opuść hantle kontrolowanie do wysokości barków."],mistakes:["Nadmierne odchylanie tułowia do tyłu.","Wypychanie hantli zbyt daleko przed siebie zamiast pionowo."]},arnold_press:{setup:["Usiądź, hantle przed barkami, dłonie zwrócone do siebie (chwyt jak w podchwycie do klatki)."],steps:["Wypychaj hantle w górę, jednocześnie rotując nadgarstki na zewnątrz.","Na górze ramiona wyprostowane, dłonie zwrócone do przodu.","Wróć tym samym torem z rotacją, kontrolowanie, do pozycji startowej."],mistakes:["Zbyt szybka rotacja bez kontroli ciężaru.","Nadmierne odchylanie się do tyłu przy wypychaniu."]},lateral_cable:{setup:["Stań bokiem do wyciągu dolnego, uchwyt w dalszej od wyciągu ręce, ręka przy boku."],steps:["Unieś ramię bokiem do wysokości barku, prowadząc łokciem.","Zatrzymaj na chwilę na szczycie.","Opuść kontrolowanie, czując stały opór przez cały zakres."],mistakes:["Zarzucanie ciężaru pędem tułowia.","Odwracanie się tułowiem zamiast izolacji barku."]},rear_delt_db:{setup:["Opad tułowia w biodrach ok. 90°, hantle zwisają pod klatką, łokcie lekko ugięte."],steps:["Unieś hantle w bok i lekko w tył, prowadząc łokciami, nie dłońmi.","Zatrzymaj na wysokości barków, ściągając łopatki.","Opuść hantle kontrolowanie do pozycji startowej."],mistakes:["Prostowanie tułowia, żeby pomóc sobie pędem.","Unoszenie ramion w górę zamiast w tył."]},rear_delt_machine:{setup:["Usiądź przodem do maszyny, klatka oparta o poduszkę, chwyć uchwyty przed sobą."],steps:["Prowadź ramiona w tył i na boki, na wysokości barków.","Ściągnij łopatki na końcu ruchu.","Wróć kontrolowanie do pozycji startowej."],mistakes:["Odrywanie klatki od poduszki.","Zbyt duży ciężar skracający zakres ruchu."]},upright_row:{setup:["Stań prosto, sztanga chwytem na szerokość barków, ręce przed udami."],steps:["Unieś sztangę wzdłuż tułowia, prowadząc łokciami wyżej niż nadgarstki.","Zatrzymaj na wysokości klatki piersiowej.","Opuść sztangę kontrolowanie do pełnego wyprostu ramion."],mistakes:["Unoszenie sztangi zbyt wysoko (obciąża barki).","Szarpanie ciężaru pędem tułowia."],safety:"Przy dyskomforcie w barku podczas ruchu w górę skróć zakres albo zamień na wznosy bokiem."},front_raise_db:{setup:["Stań prosto, hantle przed udami, chwyt neutralny lub pronowany."],steps:["Unieś jeden lub oba hantle przodem do wysokości oczu.","Zatrzymaj na chwilę na szczycie.","Opuść hantle kontrolowanie, bez bujania tułowiem."],mistakes:["Bujanie tułowiem, żeby wyrzucić ciężar.","Unoszenie powyżej wysokości oczu kosztem barku."]},shrug_bb:{setup:["Stań prosto, sztanga trzymana przed udami, chwyt na szerokość barków."],steps:["Unieś barki prosto w górę, jak najbliżej uszu.","Zatrzymaj na chwilę w najwyższym punkcie.","Opuść barki kontrolowanie do pozycji startowej."],mistakes:["Kręcenie barkami zamiast ruchu w linii prostej.","Uginanie łokci, żeby pomóc sobie unieść ciężar."]}},Hz={squat:{setup:["Sztanga na górnej części pleców, stopy na szerokość barków, lekko na zewnątrz."],steps:["Nabierz powietrza, spnij brzuch.","Zejdź w dół, prowadząc kolanami zgodnie z kierunkiem stóp.","Zejdź do pełnej głębokości, zachowując proste plecy.","Wstań, wypychając podłogę stopami."],mistakes:["Zaokrąglanie dolnego odcinka pleców.","Kolana zapadające się do środka.","Podnoszenie pięt."],safety:"Nie walcz o powtórzenie kosztem techniki — przy wątpliwościach zejdź z ciężaru."},lunges:{setup:["Stań prosto, hantle po bokach, wzrok przed siebie."],steps:["Zrób krok do przodu (lub w tył), opuszczając biodra pionowo w dół.","Zejdź, aż tylne kolano zbliży się do podłogi.","Wypchnij się z powrotem do pozycji startowej przez przednią stopę."],mistakes:["Zbyt krótki krok — kolano wychodzi przed palce.","Chwiejny balans z powodu zbyt wąskiego stawiania stóp."]},calf:{setup:["Stań na maszynie/stopniu, pięty poza krawędzią, ciężar na barkach lub w rękach."],steps:["Opuszczaj pięty jak najniżej, rozciągając łydki.","Wypchnij się na palce, jak najwyżej.","Zatrzymaj na chwilę na szczycie, wróć kontrolowanie w dół."],mistakes:["Bujanie i odbijanie się zamiast kontrolowanego ruchu.","Skracanie zakresu, zwłaszcza na dole."]},calf_seated:{setup:["Usiądź, kolana pod wałkiem obciążenia, palce stóp na podeście, pięty poza krawędzią."],steps:["Opuszczaj pięty jak najniżej.","Wypchnij się na palce, jak najwyżej, spinając łydkę.","Zatrzymaj na chwilę na górze, wróć kontrolowanie."],mistakes:["Zbyt szybkie, bujane powtórzenia.","Urywanie zakresu ruchu na dole."]},calf_press:{setup:["Na suwnicy, stopy na dolnej platformie, pięty poza krawędzią, nogi wyprostowane."],steps:["Opuszczaj pięty jak najniżej, rozciągając łydki.","Wypchnij się na palce w pełnym zakresie.","Zatrzymaj na chwilę na górze, wróć kontrolowanie."],mistakes:["Zginanie kolan, żeby oszukać zakres ruchu.","Odbijanie się od dolnej pozycji."]},front_squat:{setup:["Sztanga oparta na przednich barkach, łokcie wysoko, chwyt na szerokość barków lub skrzyżowany."],steps:["Nabierz powietrza, spnij brzuch, utrzymuj tors możliwie pionowo.","Zejdź w dół, prowadząc kolanami zgodnie z kierunkiem stóp, łokcie cały czas wysoko.","Zejdź do pełnej głębokości bez opadania tułowia do przodu.","Wstań, wypychając podłogę stopami."],mistakes:["Opadające łokcie (sztanga zsuwa się z barków).","Pochylanie tułowia do przodu przy wstawaniu."],safety:"Jeśli łokcie nie utrzymują pozycji, zmniejsz ciężar — to pierwszy sygnał utraty kontroli nad sztangą."},goblet_squat:{setup:["Trzymaj hantel oburącz przy klatce, stopy na szerokość barków."],steps:["Zejdź w głęboki przysiad, prowadząc kolanami na zewnątrz, łokcie mijają kolana od wewnątrz.","Zejdź tak nisko, jak pozwala ruchomość, zachowując proste plecy.","Wstań, wypychając podłogę stopami."],mistakes:["Opadanie hantla do przodu (garbi plecy).","Unoszenie pięt zamiast pełnego kontaktu stopy z podłogą."]},leg_press:{setup:["Stopy na szerokość barków na platformie, plecy oparte o siedzisko."],steps:["Odblokuj zabezpieczenia, opuszczaj platformę, prowadząc kolanami zgodnie z kierunkiem stóp.","Zejdź do momentu, aż dolny odcinek pleców zaczyna odrywać się od siedziska — nie dalej.","Wypchnij platformę z powrotem, nie blokując kolan na sztywno na górze."],mistakes:["Blokowanie kolan na górze ruchu.","Zbyt głębokie schodzenie kosztem odrywania bioder od siedziska."]},hack_squat:{setup:["Plecy i barki przyklejone do oparcia, stopy na platformie na szerokość barków."],steps:["Odblokuj zabezpieczenia, zejdź w dół, prowadząc kolanami zgodnie z kierunkiem stóp.","Zejdź do pełnego, kontrolowanego zakresu.","Wstań, wypychając platformę stopami, bez blokowania kolan na sztywno."],mistakes:["Odrywanie pleców od oparcia.","Zbyt szybkie, niekontrolowane opuszczanie."]},leg_ext:{setup:["Usiądź, wałek oparty o podudzia tuż nad kostkami, plecy oparte o siedzisko."],steps:["Prostuj nogi, unosząc wałek aż do pełnego wyprostu kolan.","Zatrzymaj na chwilę na górze.","Opuść kontrolowanie, bez odbicia na dole."],mistakes:["Odbijanie ciężaru na dole zamiast kontroli.","Odrywanie pleców od siedziska przy pchaniu."]},bulgarian_split:{setup:["Tylna stopa oparta na podwyższeniu za tobą, przednia noga w wykroku, hantle po bokach."],steps:["Opuszczaj biodra pionowo w dół, zginając przednie kolano.","Zejdź, aż tylne kolano zbliży się do podłogi.","Wypchnij się z powrotem, pracując głównie przednią nogą."],mistakes:["Zbyt duży ciężar całego ciała na tylnej stopie zamiast przedniej nodze.","Chwiejny balans przez zbyt wąskie ustawienie stóp."]},step_up:{setup:["Stań przed skrzynią/stopniem na wysokości ok. kolana, hantle po bokach."],steps:["Postaw całą stopę na skrzyni, przenieś na nią cały ciężar ciała.","Wypchnij się w górę jedną nogą, bez odbijania się drugą od podłogi.","Zejdź kontrolowanie tą samą nogą do pozycji startowej."],mistakes:["Odbijanie się tylną nogą (odciąża pracującą nogę).","Za wysoki stopień kosztem techniki."]},leg_curl_lying:{setup:["Połóż się przodem, wałek oparty o łydki tuż nad piętami, biodra przyklejone do ławki."],steps:["Zginaj kolana, prowadząc pięty w stronę pośladków.","Zatrzymaj na chwilę w pozycji maksymalnego zgięcia.","Wróć kontrolowanie do pełnego wyprostu nóg, bez odbicia."],mistakes:["Unoszenie bioder z ławki przy ciągnięciu.","Odbijanie ciężaru zamiast kontrolowanego powrotu."]},leg_curl_seated:{setup:["Usiądź, wałek oparty o łydki tuż nad piętami, uda przypięte pasem."],steps:["Zginaj kolana, prowadząc wałek w stronę siedziska.","Zatrzymaj na chwilę w dolnej pozycji zgięcia.","Wróć kontrolowanie do pełnego wyprostu nóg."],mistakes:["Odrywanie ud od siedziska.","Zbyt szybki, niekontrolowany powrót."]},nordic_curl:{setup:["Klęknij, kostki zablokowane (partner lub sprzęt), tułów prosty od kolan w górę."],steps:["Opadaj powoli do przodu, hamując ruch tylną częścią uda tak długo, jak się da.","W momencie utraty kontroli złap się rękami o podłogę, amortyzując upadek.","Wróć do pozycji startowej pomagając sobie rękami — to jedno z najtrudniejszych ćwiczeń, nie wstydź się dopomagać."],mistakes:["Zginanie w biodrach zamiast utrzymania linii prostej tułowia i ud.","Zbyt szybkie opadanie bez kontroli."],safety:"Bardzo wymagające dla tylnej części uda — zacznij od małego zakresu i pomocy rąk, buduj siłę stopniowo."},good_morning:{setup:["Sztanga na górnej części pleców (jak w przysiadzie), stopy na szerokość barków, lekkie zgięcie kolan."],steps:["Zawiasuj w biodrach, odsuwając je do tyłu, z prostym kręgosłupem.","Schodź, aż poczujesz mocne rozciągnięcie tylnej części uda.","Wróć, wypychając biodra do przodu i prostując tułów."],mistakes:["Zaokrąglanie pleców w trakcie schylania.","Zginanie kolan zamiast pracy w biodrach."],safety:"Zacznij od małego ciężaru — to ćwiczenie mocno obciąża dolny odcinek pleców przy błędnej technice."},rdl_bb:{setup:["Sztanga przy udach, chwyt na szerokość barków, lekko ugięte kolana, plecy proste."],steps:["Zawiasuj w biodrach, odsuwając je do tyłu, prowadząc sztangę blisko nóg.","Schodź, aż poczujesz rozciągnięcie tylnej części uda, kolana prawie proste.","Wróć, wypychając biodra do przodu."],mistakes:["Zaokrąglanie pleców na dole.","Sztanga oddalająca się od nóg (dodatkowe obciążenie na plecy)."],safety:"Schodź tylko do granicy, w której plecy zostają proste — dalej to już zaokrąglenie, nie zakres ruchu."},deadlift_sumo:{setup:["Szeroki rozstaw stóp, palce lekko na zewnątrz, chwyt sztangi między kolanami, plecy proste."],steps:["Nabierz powietrza, spnij tułów, kolana w linii palców stóp.","Wypchnij podłogę stopami, prowadząc sztangę blisko nóg.","Wyprostuj biodra na górze, bez przeprostu w plecach.","Opuszczaj sztangę tym samym torem, zawiasując w biodrach i kolanach."],mistakes:["Kolana zapadające się do środka podczas wstawania.","Zaokrąglanie pleców przy podłodze."],safety:"UWAGA NA PLECY — przy pierwszym sygnale zaokrąglenia przerwij serię."},kb_swing:{setup:["Stań nad kettlebell/hantlem, stopy nieco szerzej niż barki, chwyć ciężar oburącz."],steps:["Zawiasuj w biodrach, przesuwając ciężar między nogi (hip hinge, nie przysiad).","Wypchnij biodra gwałtownie do przodu, wyrzucając ciężar do wysokości barków.","Pozwól ciężarowi opaść z powrotem, amortyzując ruch w biodrach."],mistakes:["Podnoszenie ciężaru rękami zamiast wypychania biodrami.","Zginanie kolan jak w przysiadzie zamiast zawiasowania."]}},Zz={hipthrust:{setup:["Oprzyj górną część pleców o ławkę, sztanga nad biodrami, stopy płasko."],steps:["Wypchnij biodra w górę, aż tułów i uda utworzą linię prostą.","Spnij pośladki na górze przez chwilę.","Opuść biodra kontrolowanie, bez odbicia od podłogi."],mistakes:["Przeprost w dolnym odcinku pleców na górze ruchu.","Zbyt płytki zakres."]},rdl:{setup:["Hantle/sztanga przy udach, lekko ugięte kolana, plecy proste."],steps:["Zawiasuj w biodrach, odsuwając je do tyłu.","Schodź, prowadząc ciężar blisko nóg, aż poczujesz rozciągnięcie tylnej części uda.","Wróć, wypychając biodra do przodu."],mistakes:["Zginanie kolan zamiast pracy w biodrach.","Zaokrąglanie pleców na dole."],safety:"Schodź tylko do granicy, w której plecy zostają proste — dalej to już zaokrąglenie, nie zakres ruchu."},hipthrust_machine:{setup:["Usiądź pod wałkiem obciążenia, górna część pleców oparta o siedzisko, stopy płasko."],steps:["Wypchnij biodra w górę, aż tułów i uda utworzą linię prostą.","Spnij pośladki na chwilę na górze.","Opuść biodra kontrolowanie, bez odbicia."],mistakes:["Zbyt płytki zakres ruchu.","Pchanie samymi nogami zamiast wypychania biodrami."]},glute_bridge:{setup:["Połóż się na plecach na podłodze, kolana ugięte, stopy płasko blisko pośladków, sztanga nad biodrami."],steps:["Wypchnij biodra w górę, spinając pośladki.","Zatrzymaj na chwilę w najwyższym punkcie.","Opuść biodra kontrolowanie do podłogi."],mistakes:["Przeprost pleców na górze zamiast pracy z pośladków.","Zbyt szybkie, bujane powtórzenia."]},cable_kickback:{setup:["Przypnij mankiet wyciągu do kostki, stań przodem do wyciągu, lekkie pochylenie tułowia, trzymaj się dla balansu."],steps:["Prowadź nogę w tył i lekko w górę, spinając pośladek na końcu ruchu.","Zatrzymaj na chwilę w skurczu.","Wróć kontrolowanie do pozycji startowej, bez bujania tułowiem."],mistakes:["Bujanie tułowiem, żeby wykopnąć nogę wyżej.","Prostowanie pleców zamiast izolacji pośladka."]},abduction_machine:{setup:["Usiądź, plecy oparte o siedzisko, zewnętrzna strona ud oparta o poduszki."],steps:["Odwódź nogi na zewnątrz, pracując tylko w biodrach.","Zatrzymaj na chwilę w najszerszej pozycji.","Wróć kontrolowanie do pozycji startowej."],mistakes:["Odrywanie pleców od siedziska.","Bujanie ciałem, żeby dopchnąć ciężar."]}},Gz={curl_bb:{setup:["Stań prosto, sztanga chwytem podchwytem, łokcie blisko tułowia."],steps:["Uginaj ramiona, unosząc sztangę bez ruchu w barkach.","Spnij biceps na szczycie.","Opuść sztangę kontrolowanie do pełnego wyprostu."],mistakes:["Bujanie tułowiem, żeby „pomóc” sztandze.","Wysuwanie łokci do przodu w trakcie ruchu."]},hammer_curl:{setup:["Stań prosto, hantle po bokach, chwyt neutralny (dłonie zwrócone do siebie)."],steps:["Uginaj ramiona, unosząc hantle bez zmiany chwytu, łokcie blisko tułowia.","Spnij przedramię i biceps na szczycie.","Opuść hantle kontrolowanie do pełnego wyprostu."],mistakes:["Bujanie tułowiem zamiast czystego zgięcia w łokciu.","Wysuwanie łokci do przodu."]},curl_db:{setup:["Stań prosto, hantle po bokach, łokcie przy tułowiu."],steps:["Uginaj ramiona, unosząc hantle (naprzemiennie lub razem), obracając nadgarstek na zewnątrz.","Spnij biceps na szczycie.","Opuść hantle kontrolowanie do pełnego wyprostu."],mistakes:["Bujanie ciałem, żeby wyrzucić ciężar.","Ruch w barkach zamiast izolacji w łokciu."]},curl_incline_db:{setup:["Usiądź na ławce nachylonej ok. 45-60°, plecy oparte, ramiona swobodnie zwisają za tułowiem."],steps:["Uginaj ramiona, unosząc hantle bez odrywania barków od oparcia.","Spnij biceps na szczycie, czując pełne rozciągnięcie na starcie.","Opuść hantle kontrolowanie do pełnego wyprostu."],mistakes:["Unoszenie barków z oparcia przy trudniejszych powtórzeniach.","Zbyt duży ciężar skracający zakres na dole."]},curl_preacher:{setup:["Usiądź, pachy oparte o poduszkę modlitewnika, chwyt sztangi podchwytem."],steps:["Uginaj ramiona, unosząc sztangę, bez odrywania pach od poduszki.","Spnij biceps na szczycie.","Opuść sztangę kontrolowanie do prawie pełnego wyprostu."],mistakes:["Odrywanie pach od poduszki, żeby oszukać ruch.","Gwałtowne opuszczanie ciężaru na dole."]},curl_cable:{setup:["Stań przodem do wyciągu dolnego, chwyć drążek/uchwyty podchwytem, łokcie przy tułowiu."],steps:["Uginaj ramiona, unosząc uchwyt, czując stały opór linki.","Spnij biceps na szczycie.","Opuść kontrolowanie do pełnego wyprostu, łokcie nieruchome przez cały ruch."],mistakes:["Wysuwanie łokci do przodu w trakcie ciągnięcia.","Bujanie tułowiem."]},curl_concentration:{setup:["Usiądź, łokieć oparty o wewnętrzną stronę uda tej samej ręki, hantel zwisa swobodnie."],steps:["Uginaj ramię, unosząc hantel, bez ruchu łokcia względem uda.","Spnij biceps na szczycie.","Opuść hantel kontrolowanie do pełnego wyprostu."],mistakes:["Odrywanie łokcia od uda w trakcie ruchu.","Bujanie tułowiem, żeby pomóc unieść ciężar."]},curl_reverse:{setup:["Stań prosto, sztanga chwytem nachwytem (grzbiety dłoni do góry), łokcie przy tułowiu."],steps:["Uginaj ramiona, unosząc sztangę, nadgarstki utrzymane w linii prostej z przedramieniem.","Spnij na szczycie.","Opuść sztangę kontrolowanie do pełnego wyprostu."],mistakes:["Zginanie nadgarstków zamiast utrzymania ich prosto.","Zbyt duży ciężar — to ćwiczenie jest z natury słabsze niż klasyczne uginanie."]},french:{setup:["Sztanga/hantle nad klatką przy wyprostowanych ramionach, łokcie skierowane w sufit."],steps:["Ugnij łokcie, opuszczając ciężar w stronę czoła.","Zatrzymaj łokcie w miejscu przez cały ruch.","Wyprostuj ramiona, pracują tylko przedramiona."],mistakes:["Rozjeżdżające się łokcie na boki.","Zbyt duży ciężar kosztem zakresu ruchu."]},pushdown:{setup:["Stań przodem do wyciągu górnego, chwyć drążek nachwytem, łokcie przyklejone do boków."],steps:["Prostuj ramiona w dół, nie ruszając łokciami.","Zatrzymaj na chwilę w pełnym wyproście.","Wróć kontrolowanie do zgięcia ok. 90° w łokciu."],mistakes:["Odrywanie łokci od tułowia i pchanie całym ciałem.","Urywanie górnej części zakresu ruchu."]},bench_close_bb:{setup:["Połóż się na ławce, chwyt na szerokość barków, łokcie blisko tułowia."],steps:["Opuszczaj sztangę kontrolowanie do dolnej części klatki, łokcie ślizgają się blisko boków.","Dotknij klatki lekko, bez odbicia.","Wypchnij sztangę w górę, prostując głównie w łokciach."],mistakes:["Zbyt szeroki chwyt (robi się z tego zwykłe wyciskanie klatki).","Rozjeżdżające się łokcie na boki."]},dip_triceps:{setup:["Chwyć poręcze, wypchnij się na wyprostowane ramiona, tors utrzymuj pionowo."],steps:["Opuszczaj się, prowadząc łokcie blisko tułowia (nie na zewnątrz).","Zejdź do kąta ok. 90° w łokciach.","Wypchnij się z powrotem do pełnego wyprostu ramion."],mistakes:["Pochylanie tułowia do przodu (przenosi pracę na klatkę).","Zbyt głębokie schodzenie kosztem barków."],safety:"Przy bólu w przednim barku skróć zakres ruchu."},dip_bench:{setup:["Dłonie na krawędzi ławki za sobą, nogi wyprostowane przed sobą, biodra blisko ławki."],steps:["Opuszczaj biodra w dół, zginając łokcie do tyłu.","Zejdź do kąta ok. 90° w łokciach.","Wypchnij się z powrotem do wyprostowanych ramion."],mistakes:["Odsuwanie bioder daleko od ławki (obciąża barki).","Zbyt szybkie, niekontrolowane powtórzenia."]},pushdown_rope:{setup:["Stań przodem do wyciągu górnego, chwyć linę, łokcie przyklejone do boków."],steps:["Prostuj ramiona w dół, rozchylając końce liny na końcu ruchu.","Zatrzymaj na chwilę w pełnym wyproście.","Wróć kontrolowanie, łokcie nieruchome."],mistakes:["Odrywanie łokci od tułowia.","Brak rozchylenia liny na dole (traci się skurcz triceps)."]},overhead_ext_cable:{setup:["Stań tyłem do wyciągu dolnego, chwyć linę/uchwyt oburącz nad głową, łokcie wysoko."],steps:["Prostuj ramiona do góry, łokcie nieruchome przez cały ruch.","Zatrzymaj na chwilę w pełnym wyproście.","Wróć kontrolowanie, czując rozciągnięcie tricepsa za głową."],mistakes:["Ruch w łokciach do przodu/tyłu zamiast pracy w jednym miejscu.","Nadmierne wyginanie pleców."]},skullcrusher_db:{setup:["Połóż się na ławce, hantle nad klatką przy wyprostowanych ramionach, łokcie skierowane w sufit."],steps:["Ugnij łokcie, opuszczając hantle przy skroniach.","Utrzymaj łokcie nieruchomo przez cały ruch.","Wyprostuj ramiona, pracują tylko przedramiona."],mistakes:["Rozjeżdżające się łokcie na boki.","Ruch w barkach zamiast izolacji w łokciu."]},kickback_db:{setup:["Opad tułowia ok. 45°, ramię górne równoległe do podłogi, łokieć zgięty pod kątem 90°."],steps:["Prostuj przedramię w tył, utrzymując ramię górne nieruchomo.","Zatrzymaj na chwilę w pełnym wyproście.","Wróć kontrolowanie do kąta 90° w łokciu."],mistakes:["Ruch całym ramieniem zamiast tylko przedramieniem.","Prostowanie pleców zamiast utrzymania opadu tułowia."]}},qz={crunch:{setup:["Klęknij przodem do wyciągu górnego, chwyć linę po obu stronach głowy."],steps:["Spnij brzuch i zwiń tułów w dół, prowadząc mostek w stronę bioder.","Biodra pozostają nieruchome — ruch dzieje się tylko w kręgosłupie.","Wróć kontrolowanie do pozycji startowej, nie tracąc napięcia brzucha."],mistakes:["Ciągnięcie liny rękami zamiast zginania tułowia.","Ruch biodrami do tyłu zamiast zwijania kręgosłupa."]},plank:{setup:["Przedramiona i palce stóp na podłodze, łokcie pod barkami, ciało w jednej linii."],steps:["Spnij brzuch i pośladki, jakbyś miał dostać w brzuch.","Utrzymuj biodra na wysokości barków — ani zapadnięte, ani zadarte.","Oddychaj spokojnie, utrzymując napięcie przez cały czas trwania serii."],mistakes:["Opadające biodra (odciążają brzuch, obciążają plecy).","Zadzieranie bioder zbyt wysoko."]},side_plank:{setup:["Połóż się na boku, przedramię pod barkiem, nogi wyprostowane jedna na drugiej."],steps:["Unieś biodra z podłogi, tworząc linię prostą od kostek po głowę.","Spnij skos i boczne mięśnie tułowia (QL), nie pozwalając biodrom opaść.","Oddychaj spokojnie, utrzymując pozycję przez cały czas trwania serii."],mistakes:["Opadające biodra w trakcie trzymania.","Obracanie tułowia do przodu lub do tyłu zamiast płaskiej linii."]},hanging_leg_raise:{setup:["Zwis na drążku, chwyt nachwytem nieco szerzej niż barki, nogi wyprostowane."],steps:["Unieś nogi kontrolowanym ruchem, prowadząc je jak najwyżej (do linii bioder lub wyżej).","Zatrzymaj na chwilę na górze, spinając brzuch.","Opuść nogi kontrolowanie, bez huśtania się na drążku."],mistakes:["Huśtanie ciałem, żeby wyrzucić nogi w górę.","Zginanie kolan zamiast pracy prostymi nogami (jeśli celujesz w pełny zakres)."]},leg_raise_lying:{setup:["Połóż się na plecach, dłonie płasko pod pośladkami lub wzdłuż ciała, nogi wyprostowane."],steps:["Unoś nogi razem, aż znajdą się pod kątem ok. 90° do podłogi.","Zatrzymaj na chwilę na górze.","Opuszczaj nogi kontrolowanie, utrzymując dolny odcinek pleców przyklejony do podłogi."],mistakes:["Odrywanie dolnego odcinka pleców od podłogi przy opuszczaniu.","Zbyt szybkie, bujane powtórzenia."]},ab_wheel:{setup:["Klęknij, chwyć uchwyty kółka, ustaw je pod barkami, spnij brzuch."],steps:["Wyjeżdżaj kółkiem do przodu, wydłużając ciało, tak daleko, jak utrzymasz spięty brzuch.","Zatrzymaj się, zanim plecy zaczną się zapadać (uginać w dolnym odcinku).","Wróć do pozycji startowej, ciągnąc kółko z powrotem siłą brzucha, nie bioder."],mistakes:["Zapadanie się pleców na najdalszym punkcie wyjazdu.","Zbyt duży zakres na start, zanim brzuch jest gotowy."],safety:"Zacznij od małego zakresu ruchu — pełne rollout to zaawansowany wariant, buduj do niego stopniowo."},woodchop_cable:{setup:["Stań bokiem do wyciągu ustawionego wysoko (lub nisko dla wariantu odwrotnego), chwyć uchwyt oburącz."],steps:["Prowadź uchwyt po przekątnej od góry do dołu (lub odwrotnie), rotując tułów z biodrami.","Zatrzymaj na końcu ruchu, spinając skosy.","Wróć kontrolowanie do pozycji startowej, utrzymując napięcie brzucha."],mistakes:["Ruch tylko rękami bez rotacji tułowia z bioder.","Zbyt duży ciężar kosztem kontroli i tempa."]},russian_twist:{setup:["Usiądź, tułów odchylony do tyłu ok. 45°, hantel/kettlebell trzymany oburącz przed sobą, opcjonalnie stopy nad podłogą."],steps:["Skręcaj tułów na boki,
