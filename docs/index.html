górze, bez przeprostu w plecach.","Opuść sztangę kontrolowanie z powrotem na podstawki."],mistakes:["Zaokrąglanie pleców przy starcie.","Zbyt duży ciężar kosztem pełnego wyprostu bioder na górze."],safety:"Mniejszy zakres niż martwy ciąg klasyczny kusi do przeładowania sztangi — dobieraj ciężar pod technikę, nie na odwrót."},pulldown_straight:{setup:["Stań lub usiądź przodem do wyciągu górnego, chwyć drążek prostymi ramionami nad głową."],steps:["Prowadź ramiona w dół i lekko do tyłu, ruch tylko w barkach (łokcie prawie proste).","Zatrzymaj drążek przy udach.","Wróć kontrolowanie do pozycji nad głową."],mistakes:["Zginanie łokci — zamienia izolację w wiosłowanie.","Pomaganie sobie tułowiem."]},shrug_db:{setup:["Stań prosto, hantle po bokach, ramiona swobodnie opuszczone."],steps:["Unieś barki prosto w górę, jak najbliżej uszu.","Zatrzymaj na chwilę w najwyższym punkcie.","Opuść barki kontrolowanie do pozycji startowej."],mistakes:["Kręcenie barkami w kółko zamiast ruchu w linii prostej.","Pomaganie sobie uginaniem łokci."]},back_ext:{setup:["Ułóż się biodrami na ławce do hiperekstensji, kostki zablokowane, tułów swobodnie opuszczony."],steps:["Opuszczaj tułów w dół z prostym kręgosłupem, aż poczujesz rozciągnięcie tylnej części uda.","Unieś tułów, prowadząc ruch z bioder, do linii prostej z nogami.","Nie przeprostowuj kręgosłupa na górze ruchu."],mistakes:["Przeprost pleców na szczycie (wyginanie do tyłu).","Zginanie odcinka lędźwiowego zamiast pracy z bioder."]}},Iz={lateral:{setup:["Stań prosto, hantle po bokach, lekko ugięte łokcie."],steps:["Unieś hantle bokiem do wysokości barków, prowadząc łokciem.","Zatrzymaj na chwilę na szczycie.","Opuść hantle kontrolowanie, bez bujania ciałem."],mistakes:["Zarzucanie ciężaru pędem tułowia.","Unoszenie zbyt wysoko kosztem barku."]},ohp:{setup:["Sztanga na wysokości obojczyków, chwyt nieco szerszy niż barki, pośladki i brzuch spięte."],steps:["Wypchnij sztangę pionowo w górę, przesuwając głowę lekko do tyłu w połowie ruchu.","Zablokuj ręce na górze, sztanga nad środkiem stopy.","Opuść sztangę kontrolowanie do wysokości obojczyków."],mistakes:["Nadmierne odchylanie się do tyłu.","Wypychanie samymi barkami bez stabilizacji tułowia."],safety:"Trzymaj spięty brzuch i pośladki przez cały ruch — to chroni odcinek lędźwiowy przy wypychaniu nad głowę."},face_pull:{setup:["Wyciąg na wysokości twarzy, chwyt liny, lekki odkrok do tyłu."],steps:["Ciągnij linę do twarzy, rozciągając ją na końcu ruchu.","Łokcie prowadź wysoko, na wysokości barków.","Wróć kontrolowanie do pełnego wyprostu ramion."],mistakes:["Ciągnięcie nisko, do klatki zamiast do twarzy.","Zbyt duży ciężar kosztem zakresu ruchu."]},ohp_db:{setup:["Usiądź lub stań, hantle na wysokości barków, dłonie zwrócone do przodu."],steps:["Wypchnij hantle pionowo w górę, aż ramiona się wyprostują nad głową.","Zbliż hantle nad głową, nie stukając nimi o siebie.","Opuść hantle kontrolowanie do wysokości barków."],mistakes:["Nadmierne odchylanie tułowia do tyłu.","Wypychanie hantli zbyt daleko przed siebie zamiast pionowo."]},arnold_press:{setup:["Usiądź, hantle przed barkami, dłonie zwrócone do siebie (chwyt jak w podchwycie do klatki)."],steps:["Wypychaj hantle w górę, jednocześnie rotując nadgarstki na zewnątrz.","Na górze ramiona wyprostowane, dłonie zwrócone do przodu.","Wróć tym samym torem z rotacją, kontrolowanie, do pozycji startowej."],mistakes:["Zbyt szybka rotacja bez kontroli ciężaru.","Nadmierne odchylanie się do tyłu przy wypychaniu."]},lateral_cable:{setup:["Stań bokiem do wyciągu dolnego, uchwyt w dalszej od wyciągu ręce, ręka przy boku."],steps:["Unieś ramię bokiem do wysokości barku, prowadząc łokciem.","Zatrzymaj na chwilę na szczycie.","Opuść kontrolowanie, czując stały opór przez cały zakres."],mistakes:["Zarzucanie ciężaru pędem tułowia.","Odwracanie się tułowiem zamiast izolacji barku."]},rear_delt_db:{setup:["Opad tułowia w biodrach ok. 90°, hantle zwisają pod klatką, łokcie lekko ugięte."],steps:["Unieś hantle w bok i le
