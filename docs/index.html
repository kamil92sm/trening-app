otkowe hantli","Biceps","dumbbell",10,12,2,1,"Biceps",[],{note:"Brachialis i przedramię — grubość ramienia, mocniejszy chwyt (pomoże w MC i RDL).",restSeconds:90}),We("pushdown","Prostowanie ramion na wyciągu","Triceps","cable",10,12,2,2.5,"Triceps",[],{note:"Łokcie przyklejone do boków. Inny kąt niż francuz.",restSeconds:90}),We("calf_seated","Wspięcia na palce siedząc","Łydki","machine",12,20,3,2.5,"Łydki",[],{note:"Płaszczkowaty (kolano zgięte) — inna głowa niż wspięcia stojąc. Pauza w górze.",restSeconds:90}),We("side_plank","Plank bokiem","Brzuch","bodyweight",30,30,3,2.5,"Brzuch",[],{isHold:!0,rir:0,note:"Na stronę. Skosy + QL — core w płaszczyźnie, której deska nie łapie.",restSeconds:60})],Ar=[{id:"mon",name:"Poniedziałek",short:"Góra + Pośladki",accent:"#ef4444",exerciseIds:["bench_bb","hipthrust","row_bb","lateral","curl_bb","crunch"]},{id:"wed",name:"Środa",short:"Ciężki Dół + Klatka Skos",accent:"#3b82f6",exerciseIds:["squat","deadlift","incline_db","lunges","calf","plank"]},{id:"fri",name:"Piątek",short:"Góra II + Tył Ud",accent:"#eab308",exerciseIds:["ohp","pulldown","rdl","bench_db","row_db","french"]},{id:"bonus",name:"Bonus",short:"Uzupełnienie: tył barków, ramiona, łydki, core",accent:"#a855f7",optional:!0,active:!1,exerciseIds:["face_pull","hammer_curl","pushdown","calf_seated","side_plank"]}],fh={bench_bb:45,hipthrust:57.5,row_bb:60,lateral:9,curl_bb:17.5,crunch:37.5,squat:65,deadlift:77.5,incline_db:16,lunges:14,calf:45,plank:10,ohp:32.5,pulldown:50,rdl:22,bench_db:17.5,row_db:20,french:22.5,face_pull:20,hammer_curl:10,pushdown:20,calf_seated:30,side_plank:0},pr={name:"Kamil",barWeight:20,plates:[25,20,15,10,5,2.5,1.25],restSeconds:120,sound:!0,autoBackup:!1},Zm={Klatka:"Klatka",Plecy:"Plecy",Barki:"Barki",Nogi:"Nogi",Pośladki:"Pośladki",Łydki:"Łydki",Biceps:"Biceps",Triceps:"Triceps",Brzuch:"Brzuch"};function dh(){return{version:Gu,exercises:structuredClone(oh),days:structuredClone(Ar),targets:{...fh},sessions:[],body:[],squash:[],settings:{...
